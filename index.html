<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do List | Clean & Minimal</title>
    <meta name="description" content="A simple, elegant, and powerful to-do list for daily productivity." />
    <link rel="stylesheet" href="/src/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  </head>
  <body class="theme-midnight">
    <div id="loading-overlay" class="loading-overlay">
      <div class="loader"></div>
    </div>

    <div id="app">
      <div class="main-card glass-container">
        <header>
          <div class="header-top">
            <div class="brand">
              <h1>To-do List</h1>
            </div>
            <div class="header-actions">
              <button id="theme-btn" class="icon-btn" title="Appearance">
                <i data-lucide="palette"></i>
              </button>
            </div>
          </div>
          
          <div class="header-summary">
            <p><span id="pending-count">0</span> tasks remaining</p>
            <div class="mini-progress">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
          </div>
        </header>

        <div class="creation-area">
          <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off" />
          <div class="meta-options">
            <div class="meta-group">
              <div class="meta-item">
                <i data-lucide="calendar"></i>
                <input type="date" id="todo-date" />
              </div>
              <div class="meta-item custom-dropdown" id="tag-selector">
                <div class="selected-option">
                  <i data-lucide="tag"></i>
                  <span id="current-tag">No Tag</span>
                </div>
                <div class="dropdown-options hidden">
                  <div class="option" data-value="none">No Tag</div>
                  <div class="option" data-value="work">Work</div>
                  <div class="option" data-value="personal">Personal</div>
                  <div class="option" data-value="urgent">Urgent</div>
                  <div class="option" data-value="other">Other</div>
                </div>
              </div>
              <div class="meta-item priority-pills" id="priority-selector">
                <button class="pill" data-value="low">Low</button>
                <button class="pill active" data-value="medium">Med</button>
                <button class="pill" data-value="high">High</button>
              </div>
            </div>
            <button class="add-btn" id="add-btn">
              <i data-lucide="plus"></i>
              <span>Add Task</span>
            </button>
          </div>
        </div>

        <div class="control-bar">
          <div class="search-wrap">
            <i data-lucide="search"></i>
            <input type="text" id="search-input" placeholder="Search tasks..." />
          </div>
          <div class="filter-tabs">
            <button class="tab active" data-filter="all">All</button>
            <button class="tab" data-filter="pending">Active</button>
            <button class="tab" data-filter="completed">Done</button>
          </div>
        </div>

        <div class="list-container">
          <ul class="todo-list" id="todo-list">
            <!-- Tasks injected here -->
          </ul>
        </div>
      </div>
    </div>

    <!-- Theme Selector Modal -->
    <div id="theme-modal" class="modal hidden">
      <div class="modal-content glass-container">
        <h3>Appearance</h3>
        <div class="theme-grid">
          <button class="theme-option" data-theme="theme-midnight">
            <div class="theme-preview midnight"></div>
            <span>Midnight</span>
          </button>
          <button class="theme-option" data-theme="theme-aurora">
            <div class="theme-preview aurora"></div>
            <span>Aurora</span>
          </button>
          <button class="theme-option" data-theme="theme-crimson">
            <div class="theme-preview crimson"></div>
            <span>Crimson</span>
          </button>
          <button class="theme-option" data-theme="theme-arctic">
            <div class="theme-preview arctic"></div>
            <span>Arctic</span>
          </button>
        </div>
        <button class="modal-close" id="close-theme-modal">Close</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

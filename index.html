<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do List</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  </head>
  <body class="theme-midnight">
    <div id="loading-overlay" class="loading-overlay">
      <div class="loader"></div>
    </div>

    <div id="app">
      <header>
        <div class="header-top">
          <h1>To-do List</h1>
          <button id="theme-btn" class="icon-btn" title="Theme">
            <i data-lucide="palette"></i>
          </button>
        </div>
        <div class="header-summary">
          <p><span id="pending-count">0</span> tasks</p>
          <div class="mini-progress">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
      </header>

      <main>
        <div class="creation-area">
          <input type="text" id="todo-input" placeholder="What's on your mind?" autocomplete="off" />
          <div class="meta-options">
            <div class="meta-group">
              <div class="meta-item">
                <i data-lucide="calendar"></i>
                <input type="date" id="todo-date" />
              </div>
              <div class="meta-item custom-dropdown" id="tag-selector">
                <div class="selected-option">
                  <i data-lucide="tag"></i>
                  <span id="current-tag">No Tag</span>
                </div>
                <div class="dropdown-options hidden">
                  <div class="option" data-value="none">No Tag</div>
                  <div class="option" data-value="work">Work</div>
                  <div class="option" data-value="personal">Personal</div>
                  <div class="option" data-value="urgent">Urgent</div>
                </div>
              </div>
              <div class="meta-item priority-pills" id="priority-selector">
                <button class="pill" data-value="low">Low</button>
                <button class="pill active" data-value="medium">Med</button>
                <button class="pill" data-value="high">High</button>
              </div>
            </div>
            <button class="add-btn" id="add-btn">
              <span>Add</span>
              <i data-lucide="plus"></i>
            </button>
          </div>
        </div>

        <div class="control-bar">
          <div class="search-wrap">
            <i data-lucide="search"></i>
            <input type="text" id="search-input" placeholder="Search..." />
          </div>
          <div class="filter-tabs">
            <button class="tab active" data-filter="all">All</button>
            <button class="tab" data-filter="pending">Active</button>
            <button class="tab" data-filter="completed">Done</button>
          </div>
        </div>

        <ul class="todo-list" id="todo-list">
          <!-- Tasks injected here -->
        </ul>
      </main>
    </div>

    <!-- Theme Modal -->
    <div id="theme-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Appearance</h3>
        <div class="theme-grid">
          <button class="theme-option" data-theme="theme-midnight">Midnight</button>
          <button class="theme-option" data-theme="theme-aurora">Aurora</button>
          <button class="theme-option" data-theme="theme-crimson">Crimson</button>
          <button class="theme-option" data-theme="theme-arctic">Arctic</button>
        </div>
        <button class="icon-btn" id="close-theme-modal" style="width:100%;margin-top:1rem">Close</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
